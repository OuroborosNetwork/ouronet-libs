name: Publish to npmjs.org

# Triggered by pushing a version tag (e.g. v4.3.6).
#
# Smart per-package publish. A tag `vX.Y.Z` publishes whichever package's
# package.json version equals X.Y.Z:
#
#   - @ouronet/ouronet-core    (5.x — Ouronet protocol business logic)
#   - @ouronet/ouronet-codex   (independent 0.x semver — React Codex layer)
#   - @ouronet/talos-registry  (2.x — the generated callable surface)
#
# AUTHENTICATION IS OIDC TRUSTED PUBLISHING, NOT A TOKEN. npmjs.com trusts this
# repository + this workflow filename directly, so there is no NPM_TOKEN secret
# to leak, rotate or let expire — which is exactly how the previous publisher
# token died. Two consequences worth knowing:
#
#   * `npm` must be >= 11.5.1. `setup-node` still ships npm 10.x with Node 22,
#     so the upgrade step below is REQUIRED, not hygiene: without it npm falls
#     back to looking for a token and the publish fails with a 404.
#   * The trusted publisher on npmjs.com is pinned to THIS FILENAME, extension
#     included. It is `publish.yml`. This has been wrong in both directions: the
#     connection first read `publish.yaml` and this file was renamed to match,
#     then the connection was recreated as `publish.yml` and the rename became
#     the mismatch. Rename this file ONLY together with the connection.
#     A mismatch is refused as "OIDC token exchange error - package not found",
#     which names neither the file nor the mismatch.
#
# The two carry independent version lines, so a release is normally ONE tag for
# ONE package (v4.3.6 → ouronet-core; v0.5.7 → ouronet-codex). At least one
# package MUST match the tag, else the workflow fails before npm sees a byte.
#
# The chain-level halves (@stoachain/stoa-core, @stoachain/kadena-stoic-legacy)
# live in stoa-js and are consumed here from npm as ordinary dependencies.

on:
  push:
    tags:
      - "v*"
  # MANUAL, FOR THE OIDC PROBE BELOW. The claim npm matches names this workflow
  # FILE, so a probe that lives anywhere else proves nothing about this one.
  # Dispatching runs the probe and stops; every publishing step is tag-gated.
  workflow_dispatch:

jobs:
  publish:
    name: Smart per-package publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write   # gh release create
      id-token: write   # npm --provenance (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # REQUIRED FOR OIDC, not cosmetic: this is what writes an .npmrc naming
          # the registry. Without it npm has no registry context for the token
          # exchange and goes straight to "you are not logged in".
          registry-url: 'https://registry.npmjs.org'

      # TRUSTED PUBLISHING NEEDS npm >= 11.5.1, and Node 22 ships 10.x. Without
      # this the publish steps below look for an auth token that no longer
      # exists and fail with a 404 that reads like a missing package.
      - name: Upgrade npm (OIDC trusted publishing support)
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"

      - name: OIDC preflight (does this runner have an id-token to exchange?)
        run: |
          echo "npm            : $(npm --version)"
          echo "ID token URL   : ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-ABSENT}"
          echo "ID token value : ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-ABSENT}"
          echo "repo           : ${GITHUB_REPOSITORY}"
          echo "workflow ref   : ${GITHUB_WORKFLOW_REF}"

      - name: OIDC exchange probe (does the trusted publisher actually match?)
        run: |
          set -o pipefail
          PKG="@ouronet%2ftalos-registry"
          TOK=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
                | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          CODE=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
                 -H "Authorization: Bearer ${TOK}" -H "Content-Type: application/json" \
                 "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG}")
          echo "exchange HTTP ${CODE}"
          sed -E 's/"token":"[^"]*"/"token":"***"/g' /tmp/exchange.json || true
          echo
          if [ "${CODE}" = "200" ]; then
            echo "::notice::Trusted publisher MATCHES — a real publish will go out over OIDC."
          else
            echo "::warning::Trusted publisher did NOT match (HTTP ${CODE}). Compare the ref below"
            echo "::warning::with the connection on npmjs.com, filename extension included:"
            echo "::warning::  ${GITHUB_WORKFLOW_REF}"
          fi
          rm -f /tmp/exchange.json

      - name: Install dependencies
        if: github.ref_type == 'tag'
        run: npm install --prefer-offline --no-audit --no-fund

      # typecheck → build → test gates the publish. Build precedes test so any
      # dist-resolved imports exist.
      - name: Typecheck + Build + Test
        if: github.ref_type == 'tag'
        run: |
          npm run typecheck
          npm run build
          npm test

      - name: Detect publish queue (which package matches the tag?)
        if: github.ref_type == 'tag'
        id: queue
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CORE_VERSION=$(node -p "require('./packages/ouronet-core/package.json').version")
          CODEX_VERSION=$(node -p "require('./packages/ouronet-codex/package.json').version")
          TALOS_VERSION=$(node -p "require('./packages/talos-registry/package.json').version")
          echo "Tag: $TAG_VERSION | ouronet-core: $CORE_VERSION | ouronet-codex: $CODEX_VERSION | talos-registry: $TALOS_VERSION"

          PUBLISH_CORE="false"; PUBLISH_CODEX="false"; PUBLISH_TALOS="false"
          [ "$TAG_VERSION" = "$CORE_VERSION" ]  && PUBLISH_CORE="true"
          [ "$TAG_VERSION" = "$CODEX_VERSION" ] && PUBLISH_CODEX="true"
          [ "$TAG_VERSION" = "$TALOS_VERSION" ] && PUBLISH_TALOS="true"

          if [ "$PUBLISH_CORE" = "false" ] && [ "$PUBLISH_CODEX" = "false" ] && [ "$PUBLISH_TALOS" = "false" ]; then
            echo "::error::Tag $TAG_VERSION matches no package (ouronet-core=$CORE_VERSION, ouronet-codex=$CODEX_VERSION, talos-registry=$TALOS_VERSION)."
            exit 1
          fi

          echo "PUBLISH_OURONET_CORE=$PUBLISH_CORE"   >> "$GITHUB_OUTPUT"
          echo "PUBLISH_OURONET_CODEX=$PUBLISH_CODEX" >> "$GITHUB_OUTPUT"
          echo "PUBLISH_TALOS_REGISTRY=$PUBLISH_TALOS" >> "$GITHUB_OUTPUT"
          echo "TAG_VERSION=$TAG_VERSION"             >> "$GITHUB_OUTPUT"
          echo "── Publish queue ──"
          echo "  @ouronet/ouronet-core:   $PUBLISH_CORE"
          echo "  @ouronet/ouronet-codex:  $PUBLISH_CODEX"
          echo "  @ouronet/talos-registry: $PUBLISH_TALOS"

      # Each queued package's own README + CHANGELOG must reference the shipping
      # version — they're what npmjs.com renders.
      - name: Verify README + CHANGELOG parity for queued packages
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${{ steps.queue.outputs.TAG_VERSION }}"
          QUEUED=()
          [ "${{ steps.queue.outputs.PUBLISH_OURONET_CORE }}"  = "true" ] && QUEUED+=("packages/ouronet-core")
          [ "${{ steps.queue.outputs.PUBLISH_OURONET_CODEX }}" = "true" ] && QUEUED+=("packages/ouronet-codex")

          # talos-registry is checked on its CHANGELOG only, and deliberately.
          # Its README is a generated-surface reference, not a release log: the
          # version appears as "**This build:** N entrypoints ... surface `hash`",
          # and every figure in it is already asserted against the bundled
          # snapshot by the package's own `tests/readme.test.ts` -- which is what
          # caught a stale surface hash on 2026-10-14. Forcing it into the
          # core/codex "## Status" shape would add a second, weaker check of
          # something a real test already covers.
          if [ "${{ steps.queue.outputs.PUBLISH_TALOS_REGISTRY }}" = "true" ]; then
            FIRST=$(grep -m1 '^## ' packages/talos-registry/CHANGELOG.md)
            if ! echo "$FIRST" | grep -qE "^## ${TAG_VERSION}[[:space:]]"; then
              echo "::error::packages/talos-registry/CHANGELOG.md first heading is not ${TAG_VERSION} (found: ${FIRST})"; exit 1
            fi
            echo "✓ @ouronet/talos-registry CHANGELOG references ${TAG_VERSION}"
          fi

          for PKG_DIR in "${QUEUED[@]}"; do
            PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
            echo "── Validating ${PKG_NAME} ──"
            if ! grep -qE "\`${TAG_VERSION}\`[[:space:]]+on public npmjs" "${PKG_DIR}/README.md"; then
              echo "::error::${PKG_DIR}/README.md ## Status block does not lead with version ${TAG_VERSION}"; exit 1
            fi
            if ! grep -qE "^\*\*v${TAG_VERSION}\*\*[[:space:]]" "${PKG_DIR}/README.md"; then
              echo "::error::${PKG_DIR}/README.md version history missing a **v${TAG_VERSION}** paragraph"; exit 1
            fi
            FIRST_HEADING=$(grep -m1 '^## ' "${PKG_DIR}/CHANGELOG.md")
            if ! echo "$FIRST_HEADING" | grep -qE "^## ${TAG_VERSION}[[:space:]]"; then
              echo "::error::${PKG_DIR}/CHANGELOG.md first heading is not ${TAG_VERSION} (found: ${FIRST_HEADING})"; exit 1
            fi
            echo "✓ ${PKG_NAME} docs reference ${TAG_VERSION}"
          done

      # NO `npm whoami` STEP. Under trusted publishing there is no logged-in
      # user to report -- the OIDC exchange happens inside `npm publish` itself.
      # The old step ran `whoami || warn`, which under OIDC warns on every single
      # green run and trains everyone to ignore it.

      # Order: ouronet-core before ouronet-codex (codex peer-deps core).
      # Idempotent: skip when the version is already on the registry.
      - name: Publish @ouronet/ouronet-core
        working-directory: packages/ouronet-core
        if: github.ref_type == 'tag' && steps.queue.outputs.PUBLISH_OURONET_CORE == 'true'
        run: |
          V="${{ steps.queue.outputs.TAG_VERSION }}"
          if npm view @ouronet/ouronet-core@${V} version >/dev/null 2>&1; then
            echo "@ouronet/ouronet-core@${V} already on npm — skipping (idempotent)."
          else
            npm publish --access public --provenance
          fi

      - name: Publish @ouronet/ouronet-codex
        working-directory: packages/ouronet-codex
        if: github.ref_type == 'tag' && steps.queue.outputs.PUBLISH_OURONET_CODEX == 'true'
        run: |
          V="${{ steps.queue.outputs.TAG_VERSION }}"
          if npm view @ouronet/ouronet-codex@${V} version >/dev/null 2>&1; then
            echo "@ouronet/ouronet-codex@${V} already on npm — skipping publish."
          else
            npm publish --access public --provenance
          fi

          # `npm publish` already points `latest` at this version. This step
          # exists only to PROMOTE a version that was published under some other
          # dist-tag, so it must not fail the release when there is nothing to
          # promote. On a first publish under a new scope the registry needs a
          # few minutes to serve the packument, and an immediate `dist-tag add`
          # 404s on a package that demonstrably just published — that raced here
          # on 0.5.7 and turned a good release red.
          for attempt in 1 2 3 4 5 6; do
            CURRENT=$(npm view @ouronet/ouronet-codex dist-tags.latest 2>/dev/null || true)
            if [ "$CURRENT" = "$V" ]; then
              echo "latest already points at ${V} — nothing to promote."
              exit 0
            fi
            if [ -n "$CURRENT" ]; then
              echo "latest is ${CURRENT}; promoting ${V}."
              npm dist-tag add @ouronet/ouronet-codex@${V} latest
              exit 0
            fi
            echo "attempt ${attempt}: registry has not served the package yet; waiting 30s."
            sleep 30
          done
          echo "::warning::Could not confirm the dist-tag within 3 minutes. The publish itself succeeded; verify 'npm view @ouronet/ouronet-codex dist-tags' once the registry catches up."

      - name: Publish @ouronet/talos-registry
        working-directory: packages/talos-registry
        if: github.ref_type == 'tag' && steps.queue.outputs.PUBLISH_TALOS_REGISTRY == 'true'
        env:
          NPM_PUBLISHER: ${{ secrets.NPM_PUBLISHER }}
        run: |
          V="${{ steps.queue.outputs.TAG_VERSION }}"
          if npm view @ouronet/talos-registry@${V} version >/dev/null 2>&1; then
            echo "@ouronet/talos-registry@${V} already on npm — skipping (idempotent)."
            exit 0
          fi

          # OIDC FIRST, ALWAYS. This is the path we want; the token below exists
          # only to break a bootstrap loop and should stop being reachable once
          # it has.
          if npm publish --access public --provenance; then
            echo "published via OIDC trusted publishing."
            exit 0
          fi

          # THE BOOTSTRAP FALLBACK, and why it is here.
          #
          # npm reports an unvalidated trusted-publisher config as
          #   POST /-/npm/v1/oidc/token/exchange/package/@ouronet%2ftalos-registry -> 404
          #   "OIDC token exchange error - package not found"
          # while the package page shows the connection as "Pending validation ...
          # publish once to validate this configuration". That is circular: the
          # config will not authorise a publish until a publish has validated it.
          #
          # So ONE token-authenticated publish, from this same workflow, breaks the
          # loop. After it lands the connection validates and the OIDC attempt above
          # succeeds on every subsequent release -- at which point this branch is
          # dead code and NPM_PUBLISHER should be deleted from the repository
          # secrets. It is deliberately not the primary path and never silently
          # preferred: it only runs after OIDC has actually been tried and failed.
          if [ -z "${NPM_PUBLISHER}" ]; then
            echo "::error::OIDC publish failed and no NPM_PUBLISHER secret is set."
            echo "::error::If the trusted publisher still reads 'Pending validation', add a"
            echo "::error::granular token as NPM_PUBLISHER once to validate it, then delete it."
            exit 1
          fi
          echo "::warning::OIDC publish failed; falling back to the bootstrap token."
          cat > "${RUNNER_TEMP}/.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NPM_PUBLISHER}
          EOF
          npm publish --access public --provenance --userconfig "${RUNNER_TEMP}/.npmrc"
          rm -f "${RUNNER_TEMP}/.npmrc"

      - name: Create GitHub Release for the pushed tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "$TAG" --notes-from-tag --latest
            echo "Created GitHub Release for $TAG."
          fi
